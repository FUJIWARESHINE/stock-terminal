plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quanta.terminal'
    compileSdk 34

    defaultConfig {
        applicationId "com.quanta.terminal"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        exclude 'META-INF/*'
    }
}

dependencies {
}

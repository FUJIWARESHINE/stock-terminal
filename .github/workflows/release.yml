name: Build Windows EXE and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name QUANTA --icon assets/icon.ico --add-data "web;web" --add-data "assets/icon.ico;assets" --collect-all webview main.py

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/QUANTA.exe -DestinationPath "QUANTA-${{ github.ref_name }}-windows-x64.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QUANTA ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/QUANTA.exe
            QUANTA-${{ github.ref_name }}-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          sudo ln -sf /opt/gradle-8.5/bin/gradle /usr/local/bin/gradle
          gradle --version | head -3

      - name: Copy web assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r web android/app/src/main/assets/web

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "QUANTA-${{ github.ref_name }}-android.apk"

      - name: Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: QUANTA-${{ github.ref_name }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
